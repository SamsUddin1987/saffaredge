<!DOCTYPE html>
<html>

<head>

<title>Civil Engineers Chat</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-900 text-white h-screen flex flex-col">

<header class="bg-gray-800 p-4 text-xl">
Civil Engineers Messaging
</header>

<div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-2">
</div>

<div class="bg-gray-800 p-3 flex gap-2">

<input id="username"
placeholder="Name"
class="bg-gray-700 p-2 rounded w-40">

<input id="message"
placeholder="Type message"
class="bg-gray-700 p-2 rounded flex-1">

<button onclick="sendMessage()"
class="bg-blue-600 px-4 rounded">
Send
</button>

</div>

<script src="/static/js/chat.js"></script>

</body>

</html>
