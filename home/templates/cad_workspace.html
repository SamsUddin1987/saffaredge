{% extends 'base.html' %}
{% load static %}

{% block title %}{{ tool_title }} | SafarEdge{% endblock %}

{% block extra_css %}
<style>
    .app-workspace {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 20px);
        width: 100%;
        position: relative;
    }

    .app-content-area {
        flex: 1;
        position: relative;
        overflow: hidden;
        background-color: #121212;
    }

    .app-pane {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: none;
    }

    .app-pane.active {
        display: block;
    }

    #cad-canvas-container {
        width: 100%;
        height: 100%;
        position: absolute;
        left: 0;
        top: 0;
        cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><path d="M16 0v12M16 20v12M0 16h12M20 16h12" stroke="%2300ffcc" stroke-width="1"/><rect x="12" y="12" width="8" height="8" fill="none" stroke="%23ffffff" stroke-width="1"/></svg>') 16 16, crosshair;
    }

    #luckysheet {
        width: 100%;
        height: 100%;
        position: absolute;
        left: 0;
        top: 0;
    }

    /* Floating Toolbar */
    .cad-toolbar {
        position: absolute;
        top: 15px;
        left: 15px;
        background: rgba(30, 30, 30, 0.95);
        border: 1px solid #3c3c3c;
        border-radius: 6px;
        display: flex;
        gap: 4px;
        padding: 6px;
        z-index: 999;
    }

    .cad-tool-btn {
        background: #2a2a2a;
        color: #cccccc;
        border: 1px solid #444;
        padding: 8px 12px;
        border-radius: 4px;
        font-size: 13px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .cad-tool-btn.active {
        background: #007acc;
        color: #ffffff;
    }

    .cad-command-bar {
        position: absolute;
        bottom: 15px;
        left: 15px;
        right: 15px;
        background: rgba(20, 20, 20, 0.95);
        border: 1px solid #333;
        padding: 8px 14px;
        color: #00ffcc;
        font-family: monospace;
        font-size: 13px;
        z-index: 999;
        display: flex;
        justify-content: space-between;
    }

    .app-tab-bar {
        display: flex;
        align-items: center;
        background-color: #f3f4f6;
        border-top: 1px solid #d1d5db;
        height: 40px;
        padding: 0 10px;
        z-index: 1000;
    }

    .app-tab {
        padding: 6px 16px;
        height: 32px;
        background-color: #e5e7eb;
        color: #4b5563;
        border: 1px solid #cbd5e1;
        border-bottom: none;
        border-radius: 4px 4px 0 0;
        font-size: 13px;
        cursor: pointer;
        margin-right: 6px;
    }

    .app-tab.active {
        background-color: #ffffff;
        color: #2563eb;
        font-weight: 600;
        border-top: 2px solid #2563eb;
    }
</style>
{% endblock %}

{% block content %}
<div class="app-workspace">
    <div class="app-content-area">
        <!-- CAD Viewport -->
        <div id="cad-pane" class="app-pane active">
            <div class="cad-toolbar">
                <button class="cad-tool-btn active" id="tool-select" onclick="window.setTool('select')">Select</button>
                <button class="cad-tool-btn" id="tool-line" onclick="window.setTool('line')">Line</button>
                <button class="cad-tool-btn" id="tool-polyline" onclick="window.setTool('polyline')">Polyline</button>
                <button class="cad-tool-btn" id="tool-rect" onclick="window.setTool('rect')">Rectangle</button>
                <button class="cad-tool-btn" id="tool-circle" onclick="window.setTool('circle')">Circle</button>
                <button class="cad-tool-btn" id="tool-text" onclick="window.setTool('text')">Text</button>
                <button class="cad-tool-btn" id="tool-erase" onclick="window.setTool('erase')">Erase</button>
                <button class="cad-tool-btn" onclick="window.toggleGrid()">Grid</button>
                <button class="cad-tool-btn" onclick="window.resetZoom()">Zoom Extents</button>
            </div>

            <div id="cad-canvas-container"></div>

            <div class="cad-command-bar">
                <span id="cad-command-text">Command: SELECT</span>
                <span id="cad-coords">X: 0.00 | Y: 0.00</span>
            </div>
        </div>

        <!-- Luckysheet Viewport -->
        <div id="spreadsheet-pane" class="app-pane">
            <div id="luckysheet"></div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="app-tab-bar">
        <button class="app-tab active" id="tab-cad" onclick="switchAppTab('cad')">{{ tool_title }} (CAD)</button>
        <button class="app-tab" id="tab-spreadsheet" onclick="switchAppTab('spreadsheet')">Spreadsheet</button>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- Loads static JS file properly -->
<script src="{% static 'js/cad-viewer.js' %}"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        if (typeof initCADViewer === "function") {
            initCADViewer();
        }

        if (typeof luckysheet !== "undefined") {
            luckysheet.create({
                container: 'luckysheet',
                lang: 'en',
                showinfobar: false,
                showsheetbar: true,
                showstatisticBar: false,
                enableAddRow: true,
                allowCopy: true,
                showtoolbar: true,
                data: [{ "name": "{{ tool_title }}", "status": 1, "celldata": [] }]
            });

            const sheetEl = document.getElementById('luckysheet');
            if (sheetEl) {
                sheetEl.addEventListener('wheel', function(e) {
                    if (e.ctrlKey) e.preventDefault();
                }, { passive: false });
            }
        }
    });

    function switchAppTab(tab) {
        document.querySelectorAll('.app-pane').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.app-tab').forEach(el => el.classList.remove('active'));

        if (tab === 'cad') {
            document.getElementById('cad-pane').classList.add('active');
            document.getElementById('tab-cad').classList.add('active');
        } else if (tab === 'spreadsheet') {
            document.getElementById('spreadsheet-pane').classList.add('active');
            document.getElementById('tab-spreadsheet').classList.add('active');
            if (typeof luckysheet !== 'undefined') luckysheet.resize();
        }
    }
</script>
{% endblock %}
