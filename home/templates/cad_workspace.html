{% extends "base.html" %}
{% load static %}

{% block title %}CAD & Sheet | SafarEdge{% endblock %}

{% block body_class %}cad-page{% endblock %}

{% block extra_css %}
<style>
    body.cad-page .content {
        padding: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }
    .cad-frame {
        flex: 1 1 auto;
        width: 100%;
        height: 100%;
        min-height: 0;
        border: 0;
        display: block;
        background: #121212;
    }
</style>
{% endblock %}

{% block content %}
<iframe class="cad-frame"
        src="{% static 'webcad/index.html' %}"
        title="ArchitectSAF CAD"
        allow="clipboard-read; clipboard-write"></iframe>
{% endblock %}
