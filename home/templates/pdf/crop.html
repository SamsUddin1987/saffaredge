{% extends "base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/pdf.css' %}">

<div class="merge-container">
    <h1>Crop or Clear PDF</h1>
    
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <p>Specify margins (in points). 72 points = 1 inch.</p>

    <form action="{% url 'pdf_crop' %}" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <input type="file" name="pdf_file" id="pdf_file" class="btn-select" accept=".pdf" required>
        </div>

        <div class="form-group">
            <label for="action_mode">Select Action:</label>
            <select name="action_mode" id="action_mode" class="btn-select" style="width: 100%; padding: 10px;">
                <option value="crop">Crop (Resize page to margins)</option>
                <option value="clear">Clear (Keep page size, blank out margins)</option>
            </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group">
                <label>Margin Left:</label>
                <input type="number" name="margin_left" value="0" step="0.1">
            </div>
            <div class="form-group">
                <label>Margin Right:</label>
                <input type="number" name="margin_right" value="0" step="0.1">
            </div>
            <div class="form-group">
                <label>Margin Top:</label>
                <input type="number" name="margin_top" value="0" step="0.1">
            </div>
            <div class="form-group">
                <label>Margin Bottom:</label>
                <input type="number" name="margin_bottom" value="0" step="0.1">
            </div>
        </div>

        <div class="form-group">
            <label>Pages to Process (e.g., 1, 2, 5-8):</label>
            <input type="text" name="page_ranges" placeholder="Leave empty to process all pages">
        </div>

        <div class="button-group">
            <button type="submit" class="btn btn-merge">Process & Download</button>
            <a href="{% url 'pdf_crop' %}" class="btn btn-select">Reset</a>
        </div>
    </form>
</div>
{% endblock %}
